# fly launch --copy-config --no-deploy --ha=false --name YOUR-UNIQUE-APP
# Keep one machine: WebSocket/ticket state is in memory and data is local.
primary_region = 'ams'

[build]
  image = 'ghcr.io/nirjan-dev/servomon:latest'

[env]
  PORT = '3000'
  NUXT_BASIC_AUTH_ENABLED = 'true'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = 'data'
  destination = '/app/data'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

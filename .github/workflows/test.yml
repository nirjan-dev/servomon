name: Test
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  web:
    name: Web build + S1 suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: pnpm test
        working-directory: web
  agent:
    name: Agent type-check + socket regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check main.ts lib/enroll.ts lib/CommandResponderWebsocketClient.ts
        working-directory: agent
      - run: deno task test
        working-directory: agent

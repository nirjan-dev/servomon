name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release tag matches both packages
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$REF_TYPE" = tag || { echo 'Select a version tag when dispatching this workflow'; exit 1; }
          AGENT_VERSION=$(jq -r .version agent/deno.json)
          WEB_VERSION=$(jq -r .version web/package.json)
          test "$RELEASE_TAG" = "v$AGENT_VERSION"
          test "$RELEASE_TAG" = "v$WEB_VERSION"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

  agent:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Compile Linux agents and checksum release assets
        working-directory: agent
        run: |
          mkdir -p dist
          deno compile --target x86_64-unknown-linux-gnu --output dist/servomon-agent-linux-x86_64 --allow-all --unstable-unsafe-proto main.ts
          deno compile --target aarch64-unknown-linux-gnu --output dist/servomon-agent-linux-aarch64 --allow-all --unstable-unsafe-proto main.ts
          cp install.sh dist/install.sh
          cd dist
          sha256sum servomon-agent-linux-x86_64 servomon-agent-linux-aarch64 install.sh > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            agent/dist/servomon-agent-linux-x86_64
            agent/dist/servomon-agent-linux-aarch64
            agent/dist/install.sh
            agent/dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true

  image:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/nirjan-dev/servomon
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ./web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

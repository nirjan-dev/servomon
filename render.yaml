# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: servomon
    runtime: image
    image:
      url: ghcr.io/nirjan-dev/servomon:latest
    plan: starter
    numInstances: 1
    disk:
      name: servomon-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NUXT_BASIC_AUTH_USERS
        sync: false
      - key: NUXT_BASIC_AUTH_ENABLED
        value: "true"
      - key: PORT
        value: "3000"
